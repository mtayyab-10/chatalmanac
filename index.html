<!doctype html>
<html lang="en" dir="ltr" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Chatalmanac — chat analytics</title>
    <meta name="description"
      content="Explore patterns, timelines, and statistics from your WhatsApp chat exports. Runs entirely in your browser — your data never leaves your device." />
    <meta name="keywords"
      content="WhatsApp chat analyzer, chat statistics, chat export, privacy, local, no server" />
    <meta name="author" content="Chatalmanac" />

    <!-- Open Graph -->
    <meta property="og:title" content="Chatalmanac — chat analytics" />
    <meta property="og:description"
      content="See the story inside your conversations. Private, local, free." />
    <meta property="og:type" content="website" />


    <!-- Prevent FOUC -->
    <script>
      // Apply theme before render to avoid flash
      (function() {
        try {
          const stored = localStorage.getItem('chatalmanac_theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
