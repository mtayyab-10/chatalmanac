<!doctype html>
<html lang="en" dir="ltr" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO Metadata -->
    <title>Chatalmanac | Free & Private WhatsApp Chat Analyzer</title>
    <meta name="description"
      content="Analyze your WhatsApp chat exports instantly in your browser. Uncover chat statistics, activity heatmaps, word counters, and response rhythms 100% privately." />
    <meta name="keywords"
      content="WhatsApp chat analyzer, WhatsApp statistics, analyze WhatsApp chat, WhatsApp chat export, chat history analyzer, WhatsApp data visualization, WhatsApp message counter, private chat analytics, WhatsApp wrap up" />
    <meta name="author" content="Chatalmanac" />
    <meta name="robots" content="index, follow" />
    
    <!-- Single Canonical Link (Prevents Duplicate Content Penalties) -->
    <link rel="canonical" href="https://chatalmanac.me/" />

    <!-- Open Graph / Social Link Previews (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chatalmanac.me/" />
    <meta property="og:site_name" content="Chatalmanac" />
    <meta property="og:title" content="Chatalmanac | Free & Private WhatsApp Chat Analyzer" />
    <meta property="og:description"
      content="Transform your WhatsApp chat exports into interactive charts, timelines, and response statistics. 100% private — your data never leaves your device." />
    <meta property="og:image" content="https://chatalmanac.me/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chatalmanac WhatsApp Chat Analytics Dashboard Preview" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://chatalmanac.me/" />
    <meta name="twitter:title" content="Chatalmanac | Free & Private WhatsApp Chat Analyzer" />
    <meta name="twitter:description"
      content="Transform your WhatsApp chat exports into interactive charts, timelines, and response statistics. 100% private — your data never leaves your device." />
    <meta name="twitter:image" content="https://chatalmanac.me/og-image.png" />

    <!-- Prevent FOUC -->
    <script>
      // Apply theme before render to avoid flash
      (function() {
        try {
          const stored = localStorage.getItem('chatalmanac_theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
