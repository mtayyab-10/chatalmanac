<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Chatalmanac</title>
  <!-- Outer ring with a light green fill -->
  <circle cx="50" cy="50" r="46" fill="#D6E6DC" stroke="#124E3F" stroke-width="6" />

  <!-- Chat bubble and bars, scaled up and centered slightly lower -->
  <g transform="translate(50 53) scale(1.28) translate(-50 -50.5)">
    <path d="M 32 30 H 68 A 5 5 0 0 1 73 35 V 57 A 5 5 0 0 1 68 62 H 42 L 32 71 V 62 H 32 A 5 5 0 0 1 27 57 V 35 A 5 5 0 0 1 32 30 Z"
          fill="#FFFFFF" stroke="#124E3F" stroke-width="4"
          stroke-linejoin="round" stroke-linecap="round" />

    <!-- 3 rising bars -->
    <rect x="34" y="49" width="8" height="8" rx="1.2" fill="#124E3F" />
    <rect x="46" y="43" width="8" height="14" rx="1.2" fill="#124E3F" />
    <rect x="58" y="36" width="8" height="21" rx="1.2" fill="#124E3F" />
  </g>
</svg>
